schema_version: 1
project_root: ../..

experiment:
  name: g8_causal_weight_screen_384
  output_root: runs
  resume: true

runtime:
  python: $GUARDBENCH_PYTHON

protocol:
  resolution: 384
  attack_seed: 9999
  inpaint_seed: 2000

dataset:
  root: ../dataset/mig_inpaint_100_20260721
  manifest: config/dataset_100.json
  image_dir: images_384
  mask_dir: masks_384
  # Reuse the frozen development screen only to compare block-weight direction.
  # No method, loss, block set, prompt, mask, seed, or budget differs otherwise.
  samples: ["02", "15", "26"]
  attack_mask: enlarged_bbox_rho_1.2
  masks:
    segmentation: segmentation.png
    enlarged_bbox_rho_1.2: enlarged_bbox_rho_1.2.png
    double_enlarged_bbox_rho_1.44: double_enlarged_bbox_rho_1.44.png
  evaluation_masks:
    - segmentation
    - double_enlarged_bbox_rho_1.44

methods:
  - name: clean
    type: identity

  - name: g8_fixed_stable_mass025_150
    type: advpaint
    tags: [g8, fixed_inner, core_noun, stable_self_l2, causal_weight_control]
    params: &g8_stable
      source_root: AdvPaint-main_revised
      model_id: runwayml/stable-diffusion-inpainting
      model_revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      model_variant: fp16
      iterations: 150
      linf_pixel: 0.03
      step_size_model: 0.03
      attack_scheduler_steps: 20
      mask_protocol: two_stage
      two_stage_dir: attack_two_stage
      attack_component: cross_concentration_self_l2_multistep
      layer_match: down_blocks.2,mid_block,up_blocks.1
      timestep_indices: 0,5,10,15,19
      target_word_mode: single
      target_word_field: subject
      block_weights: down2:1,mid:1,up1:1
      spatial_entropy_weight: 0.0
      spatial_concentration_weight: 1.0
      spatial_peak_weight: 0.0
      spatial_mass_weight: 0.25
      self_l2_noise_mode: paired
      self_l2_aggregation: block_relative_rms
      attn_log_interval: 50

  - name: g8_causal_proportional_150
    type: advpaint
    tags:
      [g8, safe_inner_coverage, causal_proportional_weights, equal_loss]
    params:
      <<: *g8_stable
      # Keep the proven multi-scale basis. Only the within-basis weights adapt.
      adaptive_block_topk: 3
      adaptive_required_blocks: down2,mid,up1
      adaptive_block_score_mode: gradient_balanced
      adaptive_block_weight_mode: causal_proportional
      adaptive_block_causal_shrink: 0.25
      adaptive_block_causal_min_weight: 0.9
      adaptive_block_causal_max_weight: 1.1

      # Intentionally no saved-tensor offload/checkpoint flags at 384.

inpainters:
  - name: sd1_inpainting
    type: diffusers_inpaint
    params:
      model_id: runwayml/stable-diffusion-inpainting
      revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      variant: fp16
      dtype: float16
      device: cuda
      local_files_only: true
      steps: 50
      guidance_scale: 7.5
      strength: 1.0

evaluators:
  - name: artifact_manifest
    type: manifest
    params: {baseline_method: clean}
  - name: semantic_protection
    type: clip_lpips
    params:
      baseline_method: clean
      metric_source: evaluation_metrics.py
      device: cuda
  - name: protected_pixel
    type: protected_pixel
    params: {baseline_method: clean}
