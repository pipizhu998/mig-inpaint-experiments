schema_version: 1
project_root: ../..

experiment:
  name: g8_background_affinity_improved_384
  output_root: runs
  resume: true

runtime:
  python: $GUARDBENCH_PYTHON

protocol:
  resolution: 384
  attack_seed: 9999
  inpaint_seed: 2000

dataset:
  root: data/background_affinity_probe_384
  manifest: manifest.json
  image_dir: images
  mask_dir: masks
  samples: ["01", "02"]
  attack_mask: enlarged_bbox_rho_1.2
  masks:
    segmentation: segmentation.png
    enlarged_bbox_rho_1.2: enlarged_bbox_rho_1.2.png
  evaluation_masks: [segmentation]

methods:
  - name: clean
    type: identity

  # Exact released-style G8 control used in the background-affinity run.
  - name: g8_standard
    type: advpaint
    tags: [g8, control, concentration_only]
    params: &g8
      source_root: AdvPaint-main_revised
      model_id: runwayml/stable-diffusion-inpainting
      model_revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      model_variant: fp16
      iterations: 150
      linf_pixel: 0.03
      step_size_model: 0.03
      attack_scheduler_steps: 20
      mask_protocol: two_stage
      two_stage_dir: attack_two_stage
      attack_component: cross_concentration_self_l2_multistep
      layer_match: down_blocks.2,mid_block,up_blocks.1
      timestep_indices: 0,5,10,15,19
      target_word_mode: all
      block_weights: down2:1,mid:1,up1:1
      spatial_entropy_weight: 0.0
      spatial_concentration_weight: 1.0
      spatial_peak_weight: 0.0
      spatial_mass_weight: 0.0
      self_l2_noise_mode: resample
      self_l2_aggregation: legacy_sum
      self_l2_weight: 1.0
      attn_log_interval: 50

  # Mechanism ablation: stabilize the existing self-QKV term, without adding
  # target-token mass suppression.
  - name: g8_paired_self_mass0
    type: advpaint
    tags: [g8, self_stable, mass_ablation]
    params: &paired
      <<: *g8
      target_word_mode: single
      target_word_field: subject
      self_l2_noise_mode: paired
      self_l2_aggregation: block_relative_rms
      spatial_mass_weight: 0.0

  # Proposed G8-PM: the same stabilized self-QKV term plus one small
  # cross-attention mass penalty that closes the uniform-attention loophole.
  - name: g8_paired_self_mass025
    type: advpaint
    tags: [g8, proposed, paired_self, target_mass]
    params:
      <<: *paired
      spatial_mass_weight: 0.25

inpainters:
  - name: sd1_inpainting
    type: diffusers_inpaint
    params:
      model_id: runwayml/stable-diffusion-inpainting
      revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      variant: fp16
      dtype: float16
      device: cuda
      local_files_only: true
      steps: 50
      guidance_scale: 7.5
      strength: 1.0

evaluators:
  - name: artifact_manifest
    type: manifest
    params: {baseline_method: clean}
  - name: semantic_protection
    type: clip_lpips
    params:
      baseline_method: clean
      metric_source: evaluation_metrics.py
      device: cuda
  - name: masked_pixel
    type: masked_pixel
    params: {baseline_method: clean}
  - name: protected_pixel
    type: protected_pixel
    params: {baseline_method: clean}
