schema_version: 1
project_root: ../..

experiment:
  name: mig_original_single_both_black_384
  output_root: runs
  resume: true

runtime:
  python: $GUARDBENCH_PYTHON

protocol:
  resolution: 384
  attack_seed: 9999
  inpaint_seed: 2000

dataset:
  root: ../dataset/mig_inpaint_100_20260721
  manifest: config/dataset_100.json
  image_dir: images_384
  mask_dir: masks_384
  samples: ["01", "04", "15"]
  attack_mask: all_black
  masks:
    segmentation: segmentation.png
    bbox: bbox.png
    # Resolve one shared mask from each sample directory.
    all_black: ../all_black.png
  evaluation_masks:
    - segmentation
    - bbox

methods:
  - name: clean
    type: identity

  - name: mig_single_blackmask_blacklatent_g8
    type: advpaint
    tags: [mig_inpaint, original_g8_loss, single_stage, both_masks_black]
    params:
      source_root: AdvPaint-main_revised
      model_id: runwayml/stable-diffusion-inpainting
      model_revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      model_variant: fp16
      iterations: 250
      linf_pixel: 0.03
      step_size_model: 0.03
      attack_scheduler_steps: 20
      mask_protocol: single
      attack_component: cross_concentration_self_l2_multistep
      layer_match: down_blocks.2,mid_block,up_blocks.1
      timestep_indices: 0,5,10,15,19
      target_word_mode: all
      block_weights: down2:1,mid:1,up1:1
      spatial_entropy_weight: 0.0
      spatial_concentration_weight: 1.0
      spatial_peak_weight: 0.0
      spatial_mass_weight: 0.0
      self_l2_noise_mode: resample
      self_l2_aggregation: legacy_sum
      self_l2_weight: 1.0
      attn_log_interval: 50

inpainters:
  - name: sd1_inpainting
    type: diffusers_inpaint
    params:
      model_id: runwayml/stable-diffusion-inpainting
      revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      variant: fp16
      dtype: float16
      device: cuda
      local_files_only: true
      steps: 50
      guidance_scale: 7.5
      strength: 1.0

evaluators:
  - name: artifact_manifest
    type: manifest
    params: {baseline_method: clean}
  - name: semantic_protection
    type: clip_lpips
    params:
      baseline_method: clean
      metric_source: evaluation_metrics.py
      device: cuda
  - name: protected_pixel
    type: protected_pixel
    params: {baseline_method: clean}
