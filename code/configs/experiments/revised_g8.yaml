schema_version: 1
project_root: ../..

experiment:
  name: revised_g8_image01
  output_root: runs
  resume: true

runtime:
  python: /home/pipizhu/miniforge3/envs/defense-suite/bin/python

protocol:
  resolution: 384
  attack_seed: 9999
  inpaint_seed: 2000

dataset:
  root: .
  manifest: config/dataset_revised_g8_image01.json
  image_dir: data/images
  mask_dir: data/masks
  attack_mask: enlarged_bbox_rho_1.2
  masks:
    segmentation: segmentation.png
    bbox: bbox.png
    enlarged_bbox_rho_1.2: enlarged_bbox_rho_1.2.png
    double_enlarged_bbox_rho_1.44: double_enlarged_bbox_rho_1.44.png
  evaluation_masks: [segmentation, bbox, enlarged_bbox_rho_1.2, double_enlarged_bbox_rho_1.44]

methods:
  - name: clean
    type: identity

  - name: g8_multi_selected_ccsl
    type: advpaint
    params: &g8_common
      source_root: AdvPaint-main_revised
      model_id: runwayml/stable-diffusion-inpainting
      model_revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      model_variant: fp16
      iterations: 250
      linf_pixel: 0.03
      step_size_model: 0.03
      attack_scheduler_steps: 20
      mask_protocol: two_stage
      attack_component: cross_concentration_self_l2_multistep
      layer_match: down_blocks.2,mid_block,up_blocks.1
      timestep_indices: 0,5,10,15,19
      target_word_mode: all
      block_weights: down2:1,mid:1,up1:1
      spatial_entropy_weight: 0.0
      spatial_concentration_weight: 1.0
      spatial_peak_weight: 0.0
      spatial_mass_weight: 0.0

  - name: revised_g8_resnet_relative_l2
    type: advpaint
    params:
      <<: *g8_common
      attack_component: revised_g8

inpainters:
  - name: sd1_inpainting
    type: diffusers_inpaint
    params:
      model_id: runwayml/stable-diffusion-inpainting
      revision: 8a4288a76071f7280aedbdb3253bdb9e9d5d84bb
      variant: fp16
      dtype: float16
      device: cuda
      local_files_only: true
      steps: 50
      guidance_scale: 7.5

evaluators:
  - name: artifact_manifest
    type: manifest
    params: {baseline_method: clean}
  - name: semantic_protection
    type: clip_lpips
    params: {baseline_method: clean, metric_source: evaluation_metrics.py, device: cuda}
