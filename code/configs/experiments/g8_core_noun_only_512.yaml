schema_version: 1
project_root: ../..

experiment:
  name: g8_core_noun_only_512_first40
  output_root: runs
  resume: true

runtime:
  python: $GUARDBENCH_PYTHON

protocol:
  resolution: 512
  attack_seed: 9999
  inpaint_seed: 2000

dataset:
  root: ../dataset/mig_inpaint_100_20260721
  manifest: config/dataset_100_512.json
  image_dir: images_512
  mask_dir: masks_512
  id_field: id
  image_field: file
  attack_prompt_field: attack_prompt
  edit_prompts_field: inpaint_prompts
  samples:
    - "01"
    - "02"
    - "03"
    - "04"
    - "05"
    - "06"
    - "07"
    - "08"
    - "09"
