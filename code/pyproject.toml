[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardbench"
version = "0.1.0"
description = "YAML-driven attack, inpainting, and evaluation experiments"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
image = ["numpy>=1.24", "Pillow>=10"]
diffusion = ["diffusers>=0.27", "safetensors>=0.4", "torch>=2.1", "transformers>=4.38"]
metrics = ["torchmetrics>=1.3", "torchvision>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
guardbench = "guardbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
